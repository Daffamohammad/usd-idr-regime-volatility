[project]
name = "usd-idr-regime-volatility"
version = "0.1.0"
description = "Reproducible USD/IDR regime-aware volatility forecasting case study"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arch>=6.2.0",
  "jupyter>=1.0.0",
  "matplotlib>=3.7.0",
  "nbclient>=0.10.0",
  "nbformat>=5.10.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pytest>=8.0.0",
  "scikit-learn>=1.3.0",
  "seaborn>=0.12.0",
  "statsmodels>=0.14.0",
  "yfinance>=0.2.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
